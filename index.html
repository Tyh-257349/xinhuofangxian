<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>薪火防线 · 长征之路</title>
<style>
  :root {
    --paper: #f5ead0;
    --paper-dark: #ecdcb4;
    --ink: #3d2b1f;
    --ink-soft: #6b5138;
    --red: #b03a2e;
    --red-deep: #8e2b22;
    --army: #556b2f;
    --gold: #c9a227;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body {
    background: #2b2118;
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 18px 12px;
    min-height: 100vh;
  }
  .game-wrap {
    width: 1240px;
    max-width: 100%;
    background: var(--paper);
    border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 12px 20px;
    background: linear-gradient(180deg, #efe0ba, var(--paper));
    border-bottom: 2px solid #d8c396;
  }
  .title-block h1 {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
    font-size: 26px;
    letter-spacing: 4px;
    color: var(--red-deep);
  }
  .title-block .sub {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 1px;
    margin-top: 2px;
  }
  .hud {
    display: flex;
    gap: 14px;
    margin-left: auto;
    align-items: center;
    font-size: 14px;
  }
  .hud .stat {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff8e6;
    border: 1px solid #d8c396;
    border-radius: 6px;
    padding: 5px 10px;
    white-space: nowrap;
  }
  .hud .stat b { font-size: 16px; color: var(--red-deep); }
  .main { display: flex; }
  .canvas-box { background: var(--paper-dark); padding: 10px; }
  canvas { display: block; border-radius: 6px; box-shadow: inset 0 0 0 2px #c9ad7c; }
  .sidebar {
    width: 250px;
    flex-shrink: 0;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #f0e2c0;
    border-left: 2px solid #d8c396;
  }
  .side-title {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
    font-size: 15px;
    color: var(--ink-soft);
    letter-spacing: 2px;
    border-bottom: 1px dashed #c9a227;
    padding-bottom: 5px;
  }
  .tower-card {
    display: flex;
    gap: 10px;
    align-items: center;
    background: #fff8e6;
    border: 1px solid #d8c396;
    border-radius: 8px;
    padding: 7px 10px;
    cursor: pointer;
    transition: all .12s;
  }
  .tower-card:hover { border-color: var(--gold); background: #fff3d0; }
  .tower-card.active { border-color: var(--red); box-shadow: 0 0 0 2px rgba(176,58,46,.25); }
  .tower-card.disabled { opacity: .45; cursor: not-allowed; }
  .tower-icon { width: 36px; height: 36px; flex-shrink: 0; }
  .tower-card .t-name { font-weight: bold; font-size: 13px; }
  .tower-card .t-desc { font-size: 10.5px; color: var(--ink-soft); line-height: 1.4; margin-top: 1px; }
  .tower-card .t-cost { font-size: 11px; color: #e67e22; font-weight: bold; margin-top: 1px; }
  .btn {
    display: block;
    width: 100%;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 15px;
    font-family: inherit;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-quiz { background: var(--red); color: #fdf3e0; font-weight: bold; }
  .btn-quiz:hover:not(:disabled) { background: var(--red-deep); }
  .btn-quiz:disabled { background: #a99b7f; cursor: not-allowed; }
  .btn-wave { background: var(--army); color: #f2f5e6; font-weight: bold; }
  .btn-wave:hover { background: #46571f; }
  .btn-wave:disabled { background: #a99b7f; cursor: default; }
  .btn-plain { background: #e6d7b2; color: var(--ink); }
  .btn-plain:hover { background: #dcc999; }
  .combo-box {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    background: #fff8e6;
    border: 1px dashed #c9a227;
    border-radius: 8px;
    padding: 7px;
  }
  .combo-box b { color: var(--red); font-size: 16px; }
  .help {
    font-size: 11px;
    color: var(--ink-soft);
    line-height: 1.7;
    background: #fff8e6;
    border-radius: 8px;
    padding: 9px 11px;
    border: 1px solid #e2d0a6;
  }
  .mask {
    position: fixed; inset: 0;
    background: rgba(30, 20, 10, .55);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 50;
  }
  .mask.show { display: flex; }
  .modal {
    width: 480px;
    max-width: 92vw;
    max-height: 86vh;
    overflow-y: auto;
    background: var(--paper);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    border: 2px solid #c9ad7c;
    padding: 22px 24px;
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } }
  .modal h3 {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
    font-size: 20px;
    color: var(--red-deep);
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-align: center;
  }
  .quiz-q {
    font-size: 16px;
    line-height: 1.6;
    background: #fff8e6;
    border: 1px solid #e2d0a6;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .quiz-opt {
    display: block;
    width: 100%;
    text-align: left;
    background: #fff8e6;
    border: 1px solid #d8c396;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    margin-bottom: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: all .12s;
  }
  .quiz-opt:hover:not(:disabled) { border-color: var(--red); background: #fff3d0; }
  .quiz-opt.right { background: #e6efda; border-color: var(--army); color: #38501c; font-weight: bold; }
  .quiz-opt.wrong { background: #f3dedb; border-color: var(--red); color: var(--red-deep); }
  .quiz-timer { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .quiz-timer-track { flex: 1; height: 8px; background: #e6d7b2; border-radius: 4px; overflow: hidden; border: 1px solid #d8c396; }
  .quiz-timer-bar { height: 100%; width: 100%; background: #556b2f; border-radius: 4px; }
  .quiz-timer-bar.warn { background: #b03a2e; }
  .quiz-timer-num { font-weight: bold; color: var(--ink-soft); min-width: 26px; text-align: center; font-size: 14px; }
  .quiz-foot { text-align: center; font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .quiz-foot b { color: #e67e22; }
  .modal .row { display: flex; gap: 10px; margin-top: 16px; }
  .modal .row .btn { flex: 1; }
  .history-card {
    background: #fff8e6;
    border: 1px solid #e2d0a6;
    border-left: 4px solid var(--red);
    border-radius: 8px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.9;
    color: var(--ink);
  }
  .history-card .h-title {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
    font-size: 17px;
    color: var(--red-deep);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .tower-info-line { font-size: 14px; line-height: 2; }

  /* ---------- 移动端竖屏提示 ---------- */
  .rotate-tip { position: fixed; inset: 0; z-index: 999; background: #2b1d14; color: #f5e9d0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
  .rotate-tip .rt-title { font-size: 24px; font-weight: bold; letter-spacing: 4px; }
  .rotate-tip .rt-sub { font-size: 14px; opacity: .75; letter-spacing: 2px; }
  .rotate-tip .rot-arrow { transform-origin: 36px 104px; animation: rotSweep 1.8s ease-in-out infinite; }
  @keyframes rotSweep { 0%, 20% { transform: rotate(0deg); } 70%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (max-width: 760px) { .rotate-tip { display: flex; } }

  /* ---------- 章节地图 ---------- */
  #mapScreen { padding: 30px 36px 40px; }
  .map-head { text-align: center; margin-bottom: 8px; }
  .map-head h1 {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
    font-size: 36px;
    letter-spacing: 8px;
    color: var(--red-deep);
  }
  .map-head p { color: var(--ink-soft); font-size: 13px; margin-top: 6px; letter-spacing: 2px; }
  .map-route {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin: 26px 6px 8px; position: relative;
  }
  .map-route::before {
    content: ''; position: absolute; top: 22px; left: 3%; right: 3%;
    border-top: 2px dashed #c9ad7c;
  }
  .ch-node { width: 9%; text-align: center; position: relative; z-index: 1; cursor: pointer; }
  .ch-node .dot {
    width: 44px; height: 44px; margin: 0 auto;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: "Kaiti SC","STKaiti","KaiTi",serif;
    font-size: 19px;
    background: #fff8e6;
    border: 2px solid #c9ad7c;
    color: var(--ink-soft);
    transition: all .15s;
  }
  .ch-node:not(.locked):hover .dot { border-color: var(--red); color: var(--red-deep); transform: scale(1.08); }
  .ch-node.locked { cursor: not-allowed; }
  .ch-node.locked .dot { background: #e0d4b4; color: #a99b7f; }
  .ch-node.done .dot { background: var(--red); border-color: var(--red-deep); color: #fdf3e0; }
  .ch-node .ch-name { font-size: 12px; margin-top: 8px; color: var(--ink); line-height: 1.4; font-weight: bold; }
  .ch-node .ch-state { font-size: 10px; color: var(--ink-soft); margin-top: 2px; }
  .ch-node.done .ch-state { color: var(--red); }
  .map-tools { display: flex; justify-content: center; gap: 14px; margin-top: 26px; }
  .map-tools .btn { width: 200px; }

  /* ---------- 首页长征画卷 ---------- */
  #mapScreen { padding: 0; }
  .hero { text-align: center; padding: 32px 36px 4px; position: relative; }
  .hero .flag-deco { position: absolute; left: 56px; top: 24px; transform-origin: 8px 100px; animation: flagWave 3.4s ease-in-out infinite; }
  .hero .flag-deco.right { left: auto; right: 56px; transform-origin: 76px 100px; animation-delay: 1.4s; }
  @keyframes flagWave { 0%,100% { transform: rotate(-2.4deg); } 50% { transform: rotate(2.2deg); } }
  .hero h1 {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
    font-size: 46px;
    letter-spacing: 14px;
    color: var(--red-deep);
    text-shadow: 0 2px 0 rgba(201,162,39,.35);
  }
  .hero .sub2 { color: var(--ink-soft); font-size: 13px; margin-top: 8px; letter-spacing: 3px; }
  .hero .poem {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
    color: var(--ink-soft);
    margin-top: 10px;
    font-size: 17px;
    letter-spacing: 4px;
  }
  .hero .poem b { color: var(--red); }
  .flame-row { display: flex; justify-content: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  .player-bar { margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; min-height: 40px; }
  .player-bar .p-tag { font-size: 15px; color: var(--ink-soft); font-weight: bold; letter-spacing: 1px; }
  .player-bar .p-name-input { padding: 9px 14px; border: 1.5px solid #c9b489; border-radius: 8px; background: #fffdf5; font-size: 15px; width: 180px; text-align: center; color: #4a3226; outline: none; }
  .player-bar .p-name-input:focus { border-color: #b03a2e; }
  .player-bar .p-switch { font-size: 12px; color: #8e2b22; cursor: pointer; text-decoration: underline; background: none; border: none; font-family: inherit; }
  .flame-unit { text-align: center; width: 76px; }
  .flame-unit svg { display: block; margin: 0 auto; }
  .flame-unit .lit { filter: drop-shadow(0 0 5px rgba(230,126,34,.85)); animation: flameBob 2.2s ease-in-out infinite; }
  @keyframes flameBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
  .flame-unit .flame-label { font-size: 10.5px; color: var(--ink-soft); margin-top: 3px; letter-spacing: 1px; }
  .map-route { margin-top: 20px; }
  .scene { margin-top: 22px; line-height: 0; }
  .scene svg { display: block; width: 100%; height: auto; }
  .campfire-flame { animation: flamePulse 1.5s ease-in-out infinite; transform-origin: center bottom; transform-box: fill-box; }
  @keyframes flamePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12,.94); } }
  .quote {
    text-align: center;
    padding: 16px 20px 24px;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
    color: var(--ink-soft);
    font-size: 14.5px;
    letter-spacing: 2px;
  }
  .quote b { color: var(--red-deep); }
  .gallery-item {
    background: #fff8e6;
    border: 1px solid #e2d0a6;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 10px;
    font-size: 12.5px;
    line-height: 1.8;
  }
  .gallery-item.locked { opacity: .55; filter: grayscale(.6); }
  .gallery-item .g-title { font-weight: bold; color: var(--red-deep); font-size: 14px; font-family: "Kaiti SC","STKaiti","KaiTi",serif; letter-spacing: 1px; }
  .intro-meta {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .toast {
    position: fixed;
    left: 50%; top: 76px;
    transform: translateX(-50%);
    background: rgba(61,43,31,.92);
    color: #f5ead0;
    font-size: 14px;
    padding: 9px 20px;
    border-radius: 20px;
    z-index: 99;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
    letter-spacing: 1px;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ================= 章节地图 ================= -->
<div class="game-wrap" id="mapScreen">
  <div class="hero">
    <svg class="flag-deco" width="84" height="104" viewBox="0 0 84 104">
      <line x1="8" y1="4" x2="8" y2="100" stroke="#6b5138" stroke-width="4"/>
      <path d="M8 8 Q40 0 74 12 Q44 22 8 30 Z" fill="#b03a2e"/>
      <path d="M8 8 Q40 0 74 12" fill="none" stroke="#8e2b22" stroke-width="1.4"/>
    </svg>
    <svg class="flag-deco right" width="84" height="104" viewBox="0 0 84 104">
      <g transform="translate(84,0) scale(-1,1)">
        <line x1="8" y1="4" x2="8" y2="100" stroke="#6b5138" stroke-width="4"/>
        <path d="M8 8 Q40 0 74 12 Q44 22 8 30 Z" fill="#b03a2e"/>
        <path d="M8 8 Q40 0 74 12" fill="none" stroke="#8e2b22" stroke-width="1.4"/>
      </g>
    </svg>
    <h1>薪火防线</h1>
    <p class="sub2">长征之路 · 答题赢取信仰火种，一章一关重走远征</p>
    <p class="poem">红军不怕远征难，<b>万水千山只等闲</b></p>
    <div class="flame-row" id="flameRow"></div>
    <div class="player-bar" id="playerBar"></div>
  </div>
  <div class="map-route" id="chRoute"></div>
  <div class="map-tools">
    <button class="btn btn-plain" id="galleryBtn">史 迹 图 鉴</button>
    <button class="btn btn-plain" id="resetProgressBtn">重 置 进 度</button>
  </div>

  <!-- 长征画卷 -->
  <div class="scene">
    <svg viewBox="0 0 1240 250" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#c0392b" stop-opacity=".5"/>
          <stop offset="100%" stop-color="#c0392b" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glowF" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f39c12" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#f39c12" stop-opacity="0"/>
        </radialGradient>
        <g id="sol">
          <circle cx="0" cy="-20" r="3.4" fill="#4a3a28"/>
          <rect x="-3" y="-17" width="6.4" height="11" rx="2.4" fill="#4a3a28"/>
          <line x1="-1" y1="-6" x2="-4.5" y2="0" stroke="#4a3a28" stroke-width="2.6" stroke-linecap="round"/>
          <line x1="1" y1="-6" x2="4.5" y2="0" stroke="#4a3a28" stroke-width="2.6" stroke-linecap="round"/>
          <line x1="2" y1="-15" x2="11" y2="-19" stroke="#4a3a28" stroke-width="1.8" stroke-linecap="round"/>
        </g>
        <g id="solB">
          <circle cx="0" cy="-20" r="3.4" fill="#4a3a28"/>
          <rect x="-3" y="-17" width="6.4" height="11" rx="2.4" fill="#4a3a28"/>
          <line x1="-1" y1="-6" x2="4.5" y2="0" stroke="#4a3a28" stroke-width="2.6" stroke-linecap="round"/>
          <line x1="1" y1="-6" x2="-4.5" y2="0" stroke="#4a3a28" stroke-width="2.6" stroke-linecap="round"/>
          <line x1="-2" y1="-15" x2="-11" y2="-19" stroke="#4a3a28" stroke-width="1.8" stroke-linecap="round"/>
        </g>
      </defs>

      <!-- 红日 -->
      <circle cx="152" cy="76" r="60" fill="url(#sunG)"/>
      <circle cx="152" cy="76" r="34" fill="#b03a2e" opacity=".82"/>

      <!-- 星辰 -->
      <g fill="#c9a227" opacity=".75">
        <path d="M330 36 l1.8 3.7 4 .5 -2.9 2.8.7 4 -3.6-1.9 -3.6 1.9.7-4 -2.9-2.8 4-.5 z"/>
        <path d="M700 30 l1.5 3.1 3.4.4 -2.5 2.4.6 3.4 -3-1.6 -3 1.6.6-3.4 -2.5-2.4 3.4-.4 z"/>
        <path d="M1080 44 l1.5 3.1 3.4.4 -2.5 2.4.6 3.4 -3-1.6 -3 1.6.6-3.4 -2.5-2.4 3.4-.4 z"/>
      </g>

      <!-- 雪山（左） -->
      <path d="M0 250 L0 162 L70 106 L128 152 L210 80 L292 162 L368 120 L470 192 L470 250 Z" fill="#cdc8b6"/>
      <path d="M70 106 L48 132 L60 126 L68 137 L78 125 L92 132 Z" fill="#f5f2e8"/>
      <path d="M210 80 L180 116 L196 108 L208 124 L222 106 L242 118 Z" fill="#f5f2e8"/>
      <path d="M368 120 L352 140 L362 135 L369 144 L377 134 L386 141 Z" fill="#efece0"/>
      <path d="M0 250 L0 196 L120 172 L260 200 L420 186 L560 210 L560 250 Z" fill="#dcd6c2"/>

      <!-- 河流 -->
      <path d="M120 250 C240 222 340 224 460 236 C580 248 700 244 830 234 L830 250 Z" fill="#9db8a6" opacity=".85"/>
      <path d="M200 244 q30 -6 60 0 M320 240 q30 -6 60 0 M460 242 q30 -6 60 0" stroke="rgba(255,255,255,.5)" stroke-width="1.6" fill="none"/>

      <!-- 青山（中右） -->
      <path d="M430 250 C520 168 610 166 700 206 C770 236 850 230 930 250 Z" fill="#8a9a63"/>
      <path d="M760 250 C850 186 950 182 1050 214 C1120 236 1180 232 1240 250 Z" fill="#7c8f57"/>
      <path d="M520 232 q2 -10 0 -15 M528 234 q-2 -11 2 -16 M962 228 q2 -10 0 -14 M970 230 q-2 -10 2 -15" stroke="#6b8f4e" stroke-width="2" fill="none"/>

      <!-- 行军路 -->
      <path d="M0 234 Q620 214 1240 232" stroke="#c9a066" stroke-width="9" fill="none" opacity=".55"/>

      <!-- 行军队伍 -->
      <g>
        <use href="#sol"  x="392" y="229"/>
        <use href="#solB" x="414" y="227"/>
        <use href="#sol"  x="436" y="229"/>
        <!-- 旗手 -->
        <g transform="translate(462,227)">
          <line x1="7" y1="-40" x2="7" y2="-8" stroke="#4a3a28" stroke-width="2.2"/>
          <path d="M7 -40 Q26 -44 42 -37 Q26 -31 7 -33 Z" fill="#b03a2e"/>
          <circle cx="0" cy="-20" r="3.4" fill="#4a3a28"/>
          <rect x="-3" y="-17" width="6.4" height="11" rx="2.4" fill="#4a3a28"/>
          <line x1="-1" y1="-6" x2="-4.5" y2="0" stroke="#4a3a28" stroke-width="2.6" stroke-linecap="round"/>
          <line x1="1" y1="-6" x2="4.5" y2="0" stroke="#4a3a28" stroke-width="2.6" stroke-linecap="round"/>
        </g>
        <use href="#solB" x="488" y="229"/>
        <use href="#sol"  x="510" y="227"/>
        <use href="#solB" x="532" y="229"/>
      </g>

      <!-- 篝火营地 -->

/* 每章波次数与 Boss 配置：1-3章3波，4-6章4波，7-9章5波(末波Boss)，10章6波(3波小Boss+6波大Boss) */
const CH_WAVES = [
  {n:3}, {n:3}, {n:3},
  {n:4}, {n:4}, {n:4},
  {n:5, lastBoss:true}, {n:5, lastBoss:true}, {n:5, lastBoss:true},
  {n:6, midBoss:true, bigBoss:true}
];
const WAVES_PER_CH = CH_WAVES.map(c => c.n);
/* 波次生成器：每波敌军总数 ≥10 且逐波递增，章节越高数量越多、间隔越紧 */
function buildWaveSet(chIdx) {
  const cfg = CH_WAVES[chIdx];
  const set = [];
  for (let w = 1; w <= cfg.n; w++) {
    const grp = [];
    const isLast = w === cfg.n;
    const gruntN = Math.min(9 + chIdx * 2 + w * 2, 32);
    const fastN = Math.min(2 + Math.floor((chIdx + w) * 0.8), 14);
    const heavyN = Math.min(1 + Math.floor((chIdx + w + 1) / 2), 10);
    grp.push({t:'grunt', n:gruntN, gap:Math.max(0.38, 1.0 - chIdx*0.04 - w*0.04)});
    if (fastN) grp.push({t:'fast', n:fastN, gap:Math.max(0.32, 0.7 - chIdx*0.03)});
    if (heavyN) grp.push({t:'heavy', n:heavyN, gap:1.0});
    if (cfg.midBoss && w === 3) grp.push({t:'bossMini', n:1, gap:2});
    if (isLast && cfg.lastBoss) grp.push({t:'boss', n:1, gap:3});
    if (isLast && cfg.bigBoss) grp.push({t:'bossBig', n:1, gap:3});
    set.push(grp);
  }
  return set;
}
const WAVESETS = CHAPTERS.map((_, i) => buildWaveSet(i));

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function computeMap(chIdx) {
  const cfg = CHAPTERS[chIdx];
  waypoints = MAPS[cfg.map].map(([c, r]) => ({x: c*TILE + TILE/2, y: r*TILE + TILE/2}));
  pathSet = new Set();
  for (let i = 0; i < MAPS[cfg.map].length - 1; i++) {
    let [c1, r1] = MAPS[cfg.map][i], [c2, r2] = MAPS[cfg.map][i+1];
    const dc = Math.sign(c2-c1), dr = Math.sign(r2-r1);
    let c = c1, r = r1;
    pathSet.add(c+','+r);
    while (c !== c2 || r !== r2) { c += dc; r += dr; pathSet.add(c+','+r); }
  }
  // 地形装饰：大树占2格、大石占4格、大山占9格，均为种子随机且避开道路
  const rng = mulberry32(chIdx * 131 + 29);
  const used = new Set(pathSet);
  blockedSet = new Set();
  decorations = [];
  const isFree = (c, r) => c >= 0 && r >= 1 && c < COLS && r < ROWS && !used.has(c + ',' + r);
  const claim = (c, r) => { used.add(c + ',' + r); blockedSet.add(c + ',' + r); };
  const place = (cells, obj) => {
    if (!cells.every(x => isFree(x[0], x[1]))) return false;
    cells.forEach(x => claim(x[0], x[1]));
    decorations.push(obj);
    return true;
  };
  const rnd = (a, b) => a + Math.floor(rng() * (b - a + 1));
  // 大山 1–2 座（3×3）
  const nMount = rng() < 0.5 ? 1 : 2;
  let placed = 0, tries = 0;
  while (placed < nMount && tries < 200) {
    tries++;
    const c = rnd(0, COLS - 3), r = rnd(3, ROWS - 3);
    const cells = [];
    for (let dc = 0; dc < 3; dc++) for (let dr = 0; dr < 3; dr++) cells.push([c + dc, r + dr]);
    if (place(cells, {type: 'mountain', c, r})) placed++;
  }
  // 大松树 8 棵（竖占 2 格）
  placed = 0; tries = 0;
  while (placed < 8 && tries < 300) {
    tries++;
    const c = rnd(0, COLS - 1), r = rnd(2, ROWS - 1);
    if (place([[c, r], [c, r - 1]], {type: 'pineBig', c, r})) placed++;
  }
  // 大石 4 块（2×2）
  placed = 0; tries = 0;
  while (placed < 4 && tries < 300) {
    tries++;
    const c = rnd(0, COLS - 2), r = rnd(1, ROWS - 2);
    if (place([[c, r], [c + 1, r], [c, r + 1], [c + 1, r + 1]], {type: 'rockBig', c, r})) placed++;
  }
  // 小松树 12 棵
  placed = 0; tries = 0;
  while (placed < 12 && tries < 300) {
    tries++;
    const c = rnd(0, COLS - 1), r = rnd(1, ROWS - 1);
    if (place([[c, r]], {type: 'pine', c, r, s: 0.85 + rng() * 0.35})) placed++;
  }
  // 小石头 6 块
  placed = 0; tries = 0;
  while (placed < 6 && tries < 300) {
    tries++;
    const c = rnd(0, COLS - 1), r = rnd(1, ROWS - 1);
    if (place([[c, r]], {type: 'rock', c, r})) placed++;
  }
  theme = {
    bg: cfg.snow ? '#e8ece6' : cfg.swamp ? '#dde2ba' : cfg.dawn ? '#f3dfba' : '#e9d9b0',
    pine: cfg.snow ? '#5d7355' : cfg.swamp ? '#4c7046' : '#4a6b3a',
    snow: !!cfg.snow,
    water: cfg.water,
    waterColor: cfg.snow ? '#b9cdd4' : cfg.swamp ? '#8fa888' : '#9db8a6'
  };
}
function buildable(c, r) {
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return false;
  const k = c+','+r;
  return !pathSet.has(k) && !blockedSet.has(k);
}

  spawnQueue = []; waveActive = false;

/* ================= 音频系统（Web Audio 程序生成，无外部文件；首次点击后启动） ================= */
const AudioSys = {
  ctx: null,
  muted: localStorage.getItem('xf_mute') === '1',
  bgmTimer: null,
  pad(freq, dur, vol) {
    if (this.muted) return;
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(freq, t);
    f.type = 'lowpass';
    f.frequency.setValueAtTime(900, t);
    const v = vol || 0.02;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + 0.5);
    g.gain.setValueAtTime(v, t + Math.max(0.5, dur - 0.8));
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.1);
  },
  ensure() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(freq, dur, type, vol, when, slideTo) {
    if (this.muted) return;
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + (when || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol, cutoff, when) {
    if (this.muted) return;
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + (when || 0);
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff || 800;
    const g = c.createGain(); g.gain.value = vol || 0.2;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t);
  },
  sfx(name) {
    if (this.muted) return;
    switch (name) {
      case 'shoot':   this.tone(220, 0.06, 'square', 0.025); break;
      case 'cannon':  this.noise(0.25, 0.16, 420); this.tone(92, 0.2, 'sine', 0.14); break;
      case 'kill':    this.tone(330, 0.08, 'triangle', 0.05, 0, 220); break;
      case 'build':   this.tone(180, 0.1, 'triangle', 0.12, 0, 120); this.noise(0.08, 0.07, 1200); break;
      case 'upgrade': this.tone(523, 0.1, 'triangle', 0.11); this.tone(784, 0.16, 'triangle', 0.11, 0.09); break;
      case 'correct': this.tone(659, 0.15, 'sine', 0.13); this.tone(880, 0.28, 'sine', 0.13, 0.12); break;
      case 'wrong':   this.tone(160, 0.32, 'sawtooth', 0.08, 0, 110); break;
      case 'wave':    this.tone(196, 0.32, 'sine', 0.15, 0, 98); this.noise(0.15, 0.09, 320); break;
      case 'leak':    this.tone(440, 0.12, 'square', 0.09); this.tone(349, 0.2, 'square', 0.09, 0.13); break;
      case 'victory': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.26, 'triangle', 0.13, i * 0.15)); break;
      case 'defeat':  [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.32, 'sine', 0.11, i * 0.18)); break;
      case 'quiz':    this.tone(587, 0.08, 'sine', 0.07); break;
      case 'tick':    this.tone(880, 0.05, 'square', 0.05); break;
    }
  },
  startBGM() {
    if (this.bgmTimer || this.muted) return;
    if (!this.ensure()) return;
    // 纯史诗管弦铺底：弦乐和弦垫 + 定音鼓 + 铜管长音渐强（无拨弦旋律）
    const chords = [[196, 247, 294], [262, 330, 392], [165, 247, 330], [220, 294, 370]]; // G - C - Em - D
    const brass = [[392, 494], [523, 659], [330, 494], [440, 587]]; // 高八度铜管式和声
    let step = 0, bar = 0;
    const self = this;
    this.bgmTimer = setInterval(() => {
      if (self.muted || document.hidden) return;
      if (step % 8 === 0) {
        const ci = bar % chords.length;
        chords[ci].forEach(f => self.pad(f, 3.4));
        self.tone(98, 0.5, 'sine', 0.1, 0, 55);   // 定音鼓
        self.noise(0.2, 0.05, 200);               // 打击氛围
        if (bar % 2 === 1) brass[ci].forEach(f => self.pad(f, 3.2, 0.016)); // 铜管式长音渐强
        bar++;
      }
      step++;
    }, 420);
  },
  toggle() {
    this.muted = !this.muted;
    localStorage.setItem('xf_mute', this.muted ? '1' : '0');
    if (this.muted && this.bgmTimer) { clearInterval(this.bgmTimer); this.bgmTimer = null; }
    if (!this.muted) this.startBGM();
    return this.muted;
  }
};
function updateMuteIcon() {

  b.innerHTML = AudioSys.muted
    ? '<svg width="15" height="15" viewBox="0 0 16 16"><path d="M2 6h3l4-3v10L5 10H2z" fill="#6b5138"/><line x1="10" y1="5" x2="14" y2="11" stroke="#b03a2e" stroke-width="1.8"/><line x1="14" y1="5" x2="10" y2="11" stroke="#b03a2e" stroke-width="1.8"/></svg>'
    : '<svg width="15" height="15" viewBox="0 0 16 16"><path d="M2 6h3l4-3v10L5 10H2z" fill="#6b5138"/><path d="M10.5 5.5 Q13 8 10.5 10.5 M12 4 Q15.5 8 12 12" stroke="#6b5138" stroke-width="1.5" fill="none"/></svg>';
}

/* ================= 战斗更新 ================= */
function update(dt, now) {
  if (waveActive) {
    for (const s of spawnQueue) {
      if (!s.done && now >= s.at * 1000 + waveStartTime) { spawnEnemy(s.t); s.done = true; }
    }
    if (spawnQueue.every(s => s.done) && enemies.length === 0) {
      waveActive = false;
      if (waveIdx >= totalWaves) return endGame(true);
      const wb = document.getElementById('waveBtn');
      wb.disabled = false;
      wb.textContent = '开 始 第 ' + (waveIdx + 1) + ' 波';
      toast('第 ' + waveIdx + ' 波已击退！下一波敌人将更强，整备防线。');
      fire += 25;
      updateHUD();
    }
  }

  const buffed = now < buffUntil;

  // 支前小车产出
  for (const t of towers) {
    if (t.type !== 'supply') continue;
    const s = towerStats(t);
    t.supplyT += dt;
    if (t.supplyT >= TOWER_TYPES.supply.incomeEvery) {
      t.supplyT = 0;
      fire += s.income;
      floatText(t.x, t.y - 20, '+' + s.income, '#e67e22');
    }
  }

  // 敌人移动（战地医院光环减速）
  for (const e of enemies) {
    let mult = 1;
    if (e.slow > 0) { mult *= 0.55; e.slow -= dt; }
    for (const t of towers) {
      if (t.type === 'medic' && Math.hypot(e.x - t.x, e.y - t.y) <= TOWER_TYPES.medic.range) { mult *= TOWER_TYPES.medic.auraSlow; break; }
    }
    let move = e.spd * mult * dt;
    while (move > 0 && e.wp < waypoints.length) {
      const tgt = waypoints[e.wp];
      const dx = tgt.x - e.x, dy = tgt.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist <= move) { e.x = tgt.x; e.y = tgt.y; e.wp++; move -= dist; }
      else { e.x += dx / dist * move; e.y += dy / dist * move; move = 0; }
    }
    if (e.wp >= waypoints.length) {
      e.dead = true;
      baseHP--;
      shake = 8;
      AudioSys.sfx('leak');
      const base = waypoints[waypoints.length-1];
      floatText(base.x - 30, base.y - 30, '营地受袭！', '#b03a2e');
      updateHUD();
      if (baseHP <= 0) return endGame(false);
    }
  }
  enemies = enemies.filter(e => !e.dead);

  // 炮塔攻击
  for (const t of towers) {
    const cfg = TOWER_TYPES[t.type];
    if (cfg.dmg === 0) continue;
    const s = towerStats(t);
    const interval = 1 / (s.rate * (buffed ? 1.1 : 1));
    t.cd -= dt;
    let best = null, bestProg = -1;
    for (const e of enemies) {
      const d = Math.hypot(e.x - t.x, e.y - t.y);
      if (d <= s.range && e.wp >= bestProg) { best = e; bestProg = e.wp; }
    }
    if (best) t.angle = Math.atan2(best.y - t.y, best.x - t.x);
    if (!best || t.cd > 0) continue;
    t.cd = interval;
    let dmgMult = 1;
    for (const o of towers) {
      if (o !== t && o.type === 'banner' && Math.hypot(o.x - t.x, o.y - t.y) <= TOWER_TYPES.banner.range) { dmgMult = 1.25; break; }
    }
    if (t.type === 'torch') {
      // 精神火炬：灼烧范围内所有敌人
      for (const e of enemies) {
        if (Math.hypot(e.x - t.x, e.y - t.y) <= s.range) {
          e.hp -= s.dmg * dmgMult;
          particles.push({x: e.x, y: e.y, vx: 0, vy: -30, life: .3, max: .3, color: '#e67e22', size: 4});
        }
      }
      particles.push({x: t.x, y: t.y - 14, vx: 0, vy: -40, life: .35, max: .35, color: '#f39c12', size: 6});
    } else {
      bullets.push({x: t.x, y: t.y, target: best, spd: cfg.bulletSpeed,
        dmg: s.dmg * dmgMult, splash: s.splash, color: t.type === 'cannon' ? '#d35400' : '#f1c40f'});
      if (t.type === 'cannon') AudioSys.sfx('cannon'); else if (Math.random() < 0.25) AudioSys.sfx('shoot');
      particles.push({x: t.x + Math.cos(t.angle) * 16, y: t.y + Math.sin(t.angle) * 16,
        vx: 0, vy: 0, life: .12, max: .12, color: '#f7dc6f', size: 5});
    }
  }

  // 子弹
  for (const b of bullets) {
    if (!b.target || b.target.dead) {
      if (b.splash) explode(b);
      b.gone = true; continue;
    }
    const dx = b.target.x - b.x, dy = b.target.y - b.y;
    const dist = Math.hypot(dx, dy);
    const step = b.spd * dt;
    if (dist <= step + b.target.size) {
      if (b.splash) explode(b);
      else { b.target.hp -= b.dmg; hitFx(b.target); }
      b.gone = true;
    } else { b.x += dx / dist * step; b.y += dy / dist * step; }
  }
  bullets = bullets.filter(b => !b.gone);

  // 敌人死亡结算
  for (const e of enemies) {
    if (e.hp <= 0 && !e.dead) {
      e.dead = true;
      fire += e.reward;
      if (Math.random() < 0.4) AudioSys.sfx('kill');
      for (let i = 0; i < 6; i++) {
        particles.push({x: e.x, y: e.y, vx: (Math.random()-.5)*90, vy: (Math.random()-.5)*90,
          life: .4, max: .4, color: '#a1887f', size: 3});
      }
      floatText(e.x, e.y - 14, '+' + e.reward, '#e67e22');
    }
  }
  enemies = enemies.filter(e => !e.dead);

  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floatTexts) { f.y -= 28 * dt; f.life -= dt * 0.8; }
  floatTexts = floatTexts.filter(f => f.life > 0);

  emberT += dt;
  if (emberT > 0.18) {
    emberT = 0;
    const base = waypoints[waypoints.length - 1];
    particles.push({x: base.x + (Math.random()-.5)*16, y: base.y - 6, vx: (Math.random()-.5)*12,
      vy: -30 - Math.random()*25, life: .9, max: .9, color: '#f39c12', size: 2.5});
  }
}
function explode(b) {
  for (const e of enemies) {
    if (Math.hypot(e.x - b.x, e.y - b.y) <= b.splash) { e.hp -= b.dmg; hitFx(e); e.slow = 0.6; }
  }
  for (let i = 0; i < 8; i++) {
    particles.push({x: b.x, y: b.y, vx: (Math.random()-.5)*140, vy: (Math.random()-.5)*140,
      life: .3, max: .3, color: '#e67e22', size: 4});
  }
}
function hitFx(e) {
  particles.push({x: e.x, y: e.y, vx: 0, vy: 0, life: .15, max: .15, color: '#fff', size: 4});
}

/* ================= 章节结束 ================= */
function endGame(win) {
  gameOver = true;
  AudioSys.sfx(win ? 'victory' : 'defeat');
  const wb = document.getElementById('waveBtn');
  wb.disabled = true; wb.textContent = '— 战斗结束 —';
  document.getElementById('quizBtn').disabled = true;
  clearInterval(cdTimer);
  const row = document.getElementById('endRow');
  row.innerHTML = '';
  if (win) {
    const isNew = !progress.cards.includes(ch);
    if (isNew) progress.cards.push(ch);
    progress.unlocked = Math.max(progress.unlocked, Math.min(ch + 2, 10));
    save();
    document.getElementById('endTitle').textContent = '守 卫 成 功';
    document.getElementById('endMeta').textContent = '第' + ['一','二','三','四','五','六','七','八','九','十'][ch] + '章 · ' + CHAPTERS[ch].name + ' · 史实卡已收录';
    document.getElementById('endCard').innerHTML = '<div class="h-title">' + CHAPTERS[ch].cardTitle + '</div>' + CHAPTERS[ch].card;
    if (ch < 9) {
      const next = document.createElement('button');
      next.className = 'btn btn-quiz';
      next.textContent = '进军下一章';
      next.onclick = () => { hideMask('endMask'); showChapterIntro(ch + 1); };
      row.appendChild(next);
    } else {
      const fin = document.createElement('div');
      fin.className = 'history-card';
      fin.style.marginBottom = '0';
      fin.innerHTML = '<div class="h-title">长征胜利</div>你率部走完了二万五千里征程，十枚精神火种尽数点亮。长征精神——把全国人民和中华民族的根本利益看得高于一切，为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲——将永远照亮前行之路。';
      document.getElementById('endCard').appendChild(fin);
    }
    const back = document.createElement('button');
    back.className = 'btn btn-plain';
    back.textContent = '返回章节地图';
    back.onclick = () => { hideMask('endMask'); backToMap(); };
    row.appendChild(back);
  } else {
    document.getElementById('endTitle').textContent = '营 地 失 守';
    document.getElementById('endMeta').textContent = '第' + ['一','二','三','四','五','六','七','八','九','十'][ch] + '章 · ' + CHAPTERS[ch].name;
    document.getElementById('endCard').innerHTML = '<div class="h-title">行军笔记</div>阵地虽一时失守，信念不能失守。红军四渡赤水，靠的正是百折不回的韧性。<br><span style="color:#8e2b22">提示：多答题攒火种；兵工厂克制集群，神枪手点杀重甲，战地医院迟滞敌军，支前小车保障后勤。</span>';
    const retry = document.createElement('button');
    retry.className = 'btn btn-quiz';
    retry.textContent = '再 守 一 次';
    retry.onclick = () => { hideMask('endMask'); startChapter(ch); };
    row.appendChild(retry);
    const back2 = document.createElement('button');
    back2.className = 'btn btn-plain';
    back2.textContent = '返回章节地图';
    back2.onclick = () => { hideMask('endMask'); backToMap(); };
    row.appendChild(back2);
  }
  showMask('endMask');
}

    div.className = 'ch-node' + (done ? ' done' : '') + (!unlocked ? ' locked' : '');

      '<div class="ch-name">' + c.name + '</div>' +
      '<div class="ch-state">' + (done ? '精神火种已点亮' : unlocked ? c.date : '尚未解锁') + '</div>';

/* ================= 玩家档案栏 ================= */
function renderPlayerBar() {
  const bar = document.getElementById('playerBar');
  if (!bar) return;
  bar.innerHTML = '';
  if (!playerName) {
    const label = document.createElement('span');
    label.className = 'p-tag';
    label.textContent = '小战士，报上姓名以建档出征：';
    const input = document.createElement('input');
    input.className = 'p-name-input';
    input.maxLength = 12;
    input.placeholder = '输入你的名字';
    const btn = document.createElement('button');
    btn.className = 'btn btn-quiz';
    btn.style.padding = '8px 22px';
    btn.style.width = 'auto';
    btn.textContent = '建 档 出 征';
    const go = () => {
      const n = input.value.trim();
      if (!n) { toast('请先输入姓名'); return; }
      playerName = n;
      localStorage.setItem('xf_player', n);
      loadProgress(); save();
      renderPlayerBar(); buildChapterGrid();
      toast('欢迎，' + n + '！长征档案已建立，进度会自动保存、永不丢失');
    };
    btn.onclick = go;
    input.onkeydown = e => { if (e.key === 'Enter') go(); };
    bar.appendChild(label); bar.appendChild(input); bar.appendChild(btn);
    setTimeout(() => input.focus(), 150);
  } else {
    const tag = document.createElement('span');
    tag.className = 'p-tag';
    tag.innerHTML = '🔥 小战士：<b style="color:#8e2b22">' + playerName + '</b>' +
      ' · 已解锁 ' + progress.unlocked + ' / 10 章 · 点亮精神火种 ' + progress.cards.length + ' 枚';
    const sw = document.createElement('button');
    sw.className = 'p-switch';
    sw.textContent = '切换身份';
    sw.onclick = () => {
      playerName = '';
      localStorage.removeItem('xf_player');
      loadProgress();
      renderPlayerBar(); buildChapterGrid();
      toast('已退出当前身份，请输入新的姓名建立新档案');
    };
    bar.appendChild(tag); bar.appendChild(sw);
  }
}

/* ================= 渲染 ================= */
function render(now) {
  const t = now / 1000;
  ctx.save();
  if (shake > 0) { ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); shake *= 0.85; if (shake < .4) shake = 0; }

  ctx.fillStyle = theme.bg || '#e9d9b0';
  ctx.fillRect(-10, -10, 980, 620);

  // 河流
  ctx.fillStyle = theme.waterColor || '#9db8a6';
  ctx.fillRect(0, 0, 960, 34);
  ctx.strokeStyle = 'rgba(255,255,255,.45)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    for (let x = 0; x <= 960; x += 12) {
      const y = 8 + i * 5 + Math.sin(x / 40 + t * 1.5 + i) * 2;
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.fillStyle = '#6b5138';
  ctx.font = '12px "Kaiti SC","KaiTi",serif';
  ctx.fillText(theme.water || '', 446, 22);

  // 网格
  ctx.strokeStyle = 'rgba(107,81,56,.10)';
  ctx.lineWidth = 1;
  for (let c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(c*TILE, 0); ctx.lineTo(c*TILE, 600); ctx.stroke(); }
  for (let r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r*TILE); ctx.lineTo(960, r*TILE); ctx.stroke(); }

  // 土路
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  waypoints.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.strokeStyle = '#a87f49'; ctx.lineWidth = 34; ctx.stroke();
  ctx.strokeStyle = theme.snow ? '#d8cba8' : '#c9a066'; ctx.lineWidth = 26; ctx.stroke();
  ctx.setLineDash([4, 14]); ctx.strokeStyle = 'rgba(107,81,56,.4)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.setLineDash([]);

  // 地形装饰
  for (const d of decorations) {
    if (d.type === 'mountain') drawMountain(d);
    else if (d.type === 'pineBig') drawPine(d.c*TILE + TILE/2, d.r*TILE + TILE - 4, 1.75 + ((d.c*7 + d.r*13) % 3) * 0.12);
    else if (d.type === 'pine') drawPine(d.c*TILE + TILE/2, d.r*TILE + TILE/2, d.s);
    else if (d.type === 'rockBig') drawBigRock(d.c*TILE + TILE, d.r*TILE + TILE);
    else drawRock(d.c*TILE + TILE/2, d.r*TILE + TILE/2, theme.snow);
  }

  const sp = waypoints[0];
  ctx.fillStyle = '#6b5138';
  ctx.font = 'bold 15px "Kaiti SC","KaiTi",serif';
  ctx.fillText('敌军渡口', sp.x + 10, sp.y - 22);

  drawCampfire(waypoints[waypoints.length-1], t);

  if (selectedType && mouse && !mapScreenMode) {
    const cfg = TOWER_TYPES[selectedType];
    const c = Math.floor(mouse.x / TILE), r = Math.floor(mouse.y / TILE);
    if (buildable(c, r) && !towers.some(tw => tw.c === c && tw.r === r)) {
      ctx.fillStyle = 'rgba(85,107,47,.35)';
      ctx.fillRect(c*TILE, r*TILE, TILE, TILE);
      if (cfg.range > 0) {
        ctx.beginPath();
        ctx.arc(c*TILE+20, r*TILE+20, cfg.range, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(176,58,46,.08)'; ctx.fill();
        ctx.strokeStyle = 'rgba(176,58,46,.5)'; ctx.setLineDash([5,5]); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  }

  for (const tw of towers) drawTower(tw, t);

  if (selectedTower && towers.includes(selectedTower)) {
    const s = towerStats(selectedTower);
    const cfg = TOWER_TYPES[selectedTower.type];
    const rng = cfg.dmg === 0 ? cfg.range : s.range;
    if (rng > 0) {
      ctx.beginPath();
      ctx.arc(selectedTower.x, selectedTower.y, rng, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(201,162,39,.08)'; ctx.fill();
      ctx.strokeStyle = 'rgba(201,162,39,.7)'; ctx.setLineDash([6,6]); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  for (const e of enemies) drawEnemy(e);
  for (const b of bullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.splash ? 5 : 3, 0, Math.PI*2);
    ctx.fillStyle = b.color; ctx.fill();
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(p.life / p.max, 0);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fillStyle = p.color; ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const f of floatTexts) {
    ctx.globalAlpha = Math.max(f.life, 0);
    ctx.font = 'bold 13px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = f.color;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';

  if (performance.now() < buffUntil && !mapScreenMode) {
    ctx.font = 'bold 14px "Kaiti SC","KaiTi",serif';
    ctx.fillStyle = '#b03a2e';
    ctx.fillText('信念高涨 · 全军攻速提升中', 16, 588);
  }
  ctx.restore();
}

function drawPine(x, y, s) {
  ctx.fillStyle = '#6b4a2a';
  ctx.fillRect(x - 2*s, y + 6*s, 4*s, 8*s);
  ctx.fillStyle = theme.pine || '#4a6b3a';
  for (let i = 0; i < 3; i++) {
    const w = (16 - i*4) * s, h = 12 * s, top = y + 6*s - i*9*s - 8*s;
    ctx.beginPath();
    ctx.moveTo(x, top); ctx.lineTo(x - w/2, top + h); ctx.lineTo(x + w/2, top + h);
    ctx.closePath(); ctx.fill();
    if (theme.snow) {
      ctx.strokeStyle = 'rgba(255,255,255,.75)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - w/2 + 2, top + h - 3);
      ctx.lineTo(x, top + 4);
      ctx.lineTo(x + w/2 - 2, top + h - 3);
      ctx.stroke();
    }
  }
}
function drawRock(x, y, snow) {
  ctx.fillStyle = snow ? '#aeb4ad' : '#9a8f7d';
  ctx.beginPath(); ctx.ellipse(x, y + 4, 13, 9, 0.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = snow ? '#c9cec7' : '#b0a693';
  ctx.beginPath(); ctx.ellipse(x - 3, y + 1, 8, 5, 0.2, 0, Math.PI*2); ctx.fill();
}
function drawBigRock(x, y) {
  ctx.fillStyle = theme.snow ? '#a9afa8' : '#8f8471';
  ctx.beginPath(); ctx.ellipse(x, y + 6, 27, 18, 0.15, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = theme.snow ? '#c2c7c0' : '#a29a86';
  ctx.beginPath(); ctx.ellipse(x - 7, y - 2, 17, 11, 0.15, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = theme.snow ? '#d4d8d2' : '#b5ad99';
  ctx.beginPath(); ctx.ellipse(x + 9, y + 2, 10, 6, 0.15, 0, Math.PI*2); ctx.fill();
}
function drawMountain(d) {
  const cx = d.c*TILE + TILE*1.5;
  const baseY = d.r*TILE + TILE*3 - 4;
  const w = TILE*3.7, h = TILE*3.3;
  // 主山体
  ctx.fillStyle = theme.snow ? '#9fa8a4' : '#a3906e';
  ctx.beginPath();
  ctx.moveTo(cx - w/2, baseY);
  ctx.lineTo(cx - w*0.12, baseY - h);
  ctx.lineTo(cx + w*0.05, baseY - h*0.72);
  ctx.lineTo(cx + w*0.2, baseY - h*0.9);
  ctx.lineTo(cx + w/2, baseY);
  ctx.closePath(); ctx.fill();
  // 山顶（雪顶/岩顶）
  ctx.fillStyle = theme.snow ? '#f5f2e8' : '#c9ba9c';
  ctx.beginPath();
  ctx.moveTo(cx - w*0.12, baseY - h);
  ctx.lineTo(cx - w*0.21, baseY - h*0.8);
  ctx.lineTo(cx - w*0.14, baseY - h*0.84);
  ctx.lineTo(cx - w*0.07, baseY - h*0.73);
  ctx.lineTo(cx - w*0.02, baseY - h*0.86);
  ctx.closePath(); ctx.fill();
  // 山脊
  ctx.strokeStyle = 'rgba(61,43,31,.18)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx - w*0.12, baseY - h*0.55); ctx.lineTo(cx - w*0.26, baseY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + w*0.06, baseY - h*0.5); ctx.lineTo(cx + w*0.19, baseY); ctx.stroke();
  // 山脚阴影
  ctx.fillStyle = 'rgba(61,43,31,.12)';
  ctx.beginPath(); ctx.ellipse(cx, baseY + 2, w*0.5, 7, 0, 0, Math.PI*2); ctx.fill();
}
function drawCampfire(p, t) {
  const flick = 1 + Math.sin(t * 9) * 0.12 + Math.sin(t * 23) * 0.06;
  const grad = ctx.createRadialGradient(p.x, p.y, 4, p.x, p.y, 52 * flick);
  grad.addColorStop(0, 'rgba(243,156,18,.5)');
  grad.addColorStop(1, 'rgba(243,156,18,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(p.x, p.y, 52*flick, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(p.x - 10, p.y + 10); ctx.lineTo(p.x + 10, p.y + 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.x - 10, p.y + 2); ctx.lineTo(p.x + 10, p.y + 10); ctx.stroke();
  ctx.fillStyle = '#e67e22';
  ctx.beginPath();
  ctx.moveTo(p.x, p.y - 22 * flick);
  ctx.quadraticCurveTo(p.x + 10, p.y - 6, p.x + 5, p.y + 4);
  ctx.quadraticCurveTo(p.x, p.y + 9, p.x - 5, p.y + 4);
  ctx.quadraticCurveTo(p.x - 10, p.y - 6, p.x, p.y - 22 * flick);
  ctx.fill();
  ctx.fillStyle = '#f7dc6f';
  ctx.beginPath(); ctx.arc(p.x, p.y, 4.5*flick, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#6b5138';
  ctx.font = 'bold 16px "Kaiti SC","KaiTi",serif';
  ctx.fillText('篝火营地', p.x - 56, p.y + 32);
}
function drawTower(tw, t) {
  const lv = tw.level;
  const x = tw.x, y = tw.y;
  ctx.fillStyle = 'rgba(107,81,56,.25)';
  ctx.beginPath(); ctx.ellipse(x, y + 12, 16, 6, 0, 0, Math.PI*2); ctx.fill();
  if (tw.type === 'sentry') {
    ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x - 8, y + 12); ctx.lineTo(x - 5, y - 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 8, y + 12); ctx.lineTo(x + 5, y - 4); ctx.stroke();
    ctx.fillStyle = '#9c6b3c';
    ctx.fillRect(x - 11, y - 10, 22, 8);
    ctx.save();
    ctx.translate(x, y - 6); ctx.rotate(tw.angle);
    ctx.strokeStyle = '#3d2b1f'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16, 0); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#5d3d22';
    ctx.beginPath(); ctx.arc(x, y - 6, 5, 0, Math.PI*2); ctx.fill();
  } else if (tw.type === 'cannon') {
    ctx.fillStyle = '#4c5b2a';
    ctx.beginPath(); ctx.moveTo(x - 15, y + 12); ctx.lineTo(x, y - 12); ctx.lineTo(x + 15, y + 12); ctx.closePath(); ctx.fill();
    ctx.save();
    ctx.translate(x, y - 2); ctx.rotate(tw.angle);
    ctx.fillStyle = '#333';
    ctx.fillRect(0, -3.5, 18, 7);
    ctx.restore();
    ctx.fillStyle = '#2e3818';
    ctx.beginPath(); ctx.arc(x, y + 8, 4, 0, Math.PI*2); ctx.fill();
  } else if (tw.type === 'banner') {
    const wave = Math.sin(t * 4) * 2;
    ctx.strokeStyle = '#6b5138'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y + 12); ctx.lineTo(x, y - 16); ctx.stroke();
    ctx.fillStyle = '#b03a2e';
    ctx.beginPath();
    ctx.moveTo(x, y - 16);
    ctx.quadraticCurveTo(x + 12, y - 13 + wave, x + 22, y - 9 + wave);
    ctx.lineTo(x, y - 3);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f5ead0';
    ctx.beginPath(); ctx.arc(x, y + 2, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y, TOWER_TYPES.banner.range * (0.98 + Math.sin(t*2)*0.02), 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(176,58,46,.18)'; ctx.setLineDash([4,8]); ctx.stroke(); ctx.setLineDash([]);
  } else if (tw.type === 'marksman') {
    ctx.fillStyle = '#556b2f';
    ctx.beginPath(); ctx.arc(x, y + 2, 9, 0, Math.PI*2); ctx.fill();
    ctx.save();
    ctx.translate(x, y - 4); ctx.rotate(tw.angle);
    ctx.strokeStyle = '#3d2b1f'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(18, 0); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#3d2b1f';
    ctx.beginPath(); ctx.arc(x, y - 8, 4.5, 0, Math.PI*2); ctx.fill();
  } else if (tw.type === 'medic') {
    ctx.fillStyle = '#f5ead0';
    ctx.fillRect(x - 13, y - 12, 26, 24);
    ctx.strokeStyle = '#b03a2e'; ctx.lineWidth = 2;
    ctx.strokeRect(x - 13, y - 12, 26, 24);
    ctx.fillStyle = '#b03a2e';
    ctx.fillRect(x - 3, y - 9, 6, 18);
    ctx.fillRect(x - 9, y - 3, 18, 6);
    ctx.beginPath();
    ctx.arc(x, y, TOWER_TYPES.medic.range * (0.98 + Math.sin(t*2)*0.02), 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(176,58,46,.15)'; ctx.setLineDash([4,8]); ctx.stroke(); ctx.setLineDash([]);
  } else if (tw.type === 'supply') {
    ctx.fillStyle = '#9c6b3c';
    ctx.fillRect(x - 12, y - 6, 24, 12);
    ctx.fillStyle = '#b98d55';
    ctx.beginPath(); ctx.moveTo(x - 12, y - 6); ctx.lineTo(x - 6, y - 13); ctx.lineTo(x + 8, y - 13); ctx.lineTo(x + 12, y - 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3d2b1f';
    ctx.beginPath(); ctx.arc(x - 7, y + 8, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 7, y + 8, 4, 0, Math.PI*2); ctx.fill();
  } else if (tw.type === 'torch') {
    const flick = 1 + Math.sin(t * 10) * 0.15;
    const grad = ctx.createRadialGradient(x, y - 12, 2, x, y - 12, 34 * flick);
    grad.addColorStop(0, 'rgba(243,156,18,.4)');
    grad.addColorStop(1, 'rgba(243,156,18,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y - 12, 34*flick, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#6b5138'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, y + 12); ctx.lineTo(x, y - 8); ctx.stroke();
    ctx.fillStyle = '#e67e22';
    ctx.beginPath();
    ctx.moveTo(x, y - 26 * flick);
    ctx.quadraticCurveTo(x + 7, y - 14, x + 3, y - 6);
    ctx.quadraticCurveTo(x, y - 2, x - 3, y - 6);
    ctx.quadraticCurveTo(x - 7, y - 14, x, y - 26 * flick);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x, y, TOWER_TYPES.torch.range, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(230,126,34,.15)'; ctx.setLineDash([4,8]); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.fillStyle = '#c9a227';
  for (let i = 0; i < lv; i++) {
    ctx.beginPath();
    ctx.arc(x - 8 + i * 8, y + 18, 2.4, 0, Math.PI*2);
    ctx.fill();
  }
}
function drawEnemy(e) {
  ctx.fillStyle = 'rgba(0,0,0,.15)';
  ctx.beginPath(); ctx.ellipse(e.x, e.y + e.size * 0.8, e.size, e.size * 0.4, 0, 0, Math.PI*2); ctx.fill();
  const isBoss = e.type === 'boss' || e.type === 'bossMini' || e.type === 'bossBig';
  if (isBoss) {
    const spikes = e.type === 'bossBig' ? 10 : 8;
    // 暗红威压光环（缓慢脉动）
    const pulse = 1 + Math.sin(performance.now() / 300) * 0.08;
    ctx.strokeStyle = 'rgba(176,58,46,.55)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.size * 1.55 * pulse, 0, Math.PI*2); ctx.stroke();
    // 尖刺星形装甲身躯
    ctx.fillStyle = '#4a2320';
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 === 0 ? e.size * 1.35 : e.size * 0.85;
      const a = (Math.PI * i) / spikes - Math.PI / 2;
      i === 0 ? ctx.moveTo(e.x + Math.cos(a) * r, e.y + Math.sin(a) * r)
              : ctx.lineTo(e.x + Math.cos(a) * r, e.y + Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
    // 躯干
    ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.size * 0.85, 0, Math.PI*2); ctx.fill();
    // 钢盔 + 红色护目镜
    ctx.fillStyle = '#2e2019';
    ctx.beginPath(); ctx.arc(e.x, e.y - e.size * 0.15, e.size * 0.55, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(e.x - e.size * 0.38, e.y - e.size * 0.32, e.size * 0.76, e.size * 0.15);
    // 背后军旗
    ctx.strokeStyle = '#3a2a1e'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(e.x, e.y - e.size * 1.2); ctx.lineTo(e.x, e.y - e.size * 1.2 - 14); ctx.stroke();
    ctx.fillStyle = '#7a1f16';
    ctx.beginPath();
    ctx.moveTo(e.x, e.y - e.size * 1.2 - 14);
    ctx.lineTo(e.x + 15, e.y - e.size * 1.2 - 10);
    ctx.lineTo(e.x, e.y - e.size * 1.2 - 6);
    ctx.closePath(); ctx.fill();
    // 头目名号
    ctx.fillStyle = '#8e2b22';
    ctx.font = 'bold 11px "Kaiti SC","KaiTi",serif';
    ctx.textAlign = 'center';
    ctx.fillText(e.type === 'bossBig' ? '★ 围剿总司令 ★' : e.type === 'boss' ? '★ 铁索封锁头目 ★' : '◆ 桥头碉楼头目 ◆',
      e.x, e.y - e.size * 1.2 - 18);
    ctx.textAlign = 'start';
  } else {
    ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.size, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#565b4a';
    ctx.beginPath(); ctx.arc(e.x, e.y - e.size * 0.35, e.size * 0.72, Math.PI, 0); ctx.fill();
  }
  const w = e.size * (isBoss ? 2.8 : 2.2), ratio = Math.max(e.hp / e.maxHp, 0);
  ctx.fillStyle = 'rgba(61,43,31,.5)';
  ctx.fillRect(e.x - w/2, e.y - e.size - 8, w, isBoss ? 5 : 4);
  ctx.fillStyle = ratio > 0.5 ? '#7a9b4e' : ratio > 0.25 ? '#e67e22' : '#b03a2e';
  ctx.fillRect(e.x - w/2, e.y - e.size - 8, w * ratio, isBoss ? 5 : 4);
}

/* ================= 交互 ================= */
cv.addEventListener('mousemove', ev => {
  const rect = cv.getBoundingClientRect();
  mouse = {x: (ev.clientX - rect.left) * (cv.width / rect.width), y: (ev.clientY - rect.top) * (cv.height / rect.height)};
});
cv.addEventListener('mouseleave', () => { mouse = null; });
cv.addEventListener('click', () => {
  if (gameOver || modalOpen() || mapScreenMode || !mouse) return;
  const c = Math.floor(mouse.x / TILE), r = Math.floor(mouse.y / TILE);
  if (selectedType) { tryBuild(c, r); return; }
  const tw = towers.find(t => t.c === c && t.r === r);
  if (tw) openTowerPanel(tw);
});

document.getElementById('quizBtn').onclick = openQuiz;
document.getElementById('waveBtn').onclick = () => {
  if (!modalOpen()) { waveStartTime = performance.now(); startWave(); }
};
document.getElementById('quitBtn').onclick = backToMap;

/* ================= 主循环 ================= */
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  if (!mapScreenMode && !gameOver && !modalOpen()) update(dt, now);
  if (!mapScreenMode) render(now);
  requestAnimationFrame(loop);
}
// 错误兜底：异常直接显示在页面上，便于诊断
window.onerror = function(msg, src, line) {
  const t = document.getElementById('toast');
  t.textContent = '脚本错误: ' + msg + ' (行 ' + line + ')';
  t.classList.add('show');
};
document.getElementById('muteBtn').onclick = (ev) => { ev.stopPropagation(); AudioSys.toggle(); updateMuteIcon(); };
updateMuteIcon();
document.addEventListener('click', () => AudioSys.startBGM(), { once: true });

/* ================= 移动端自动横屏 ================= */
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
function tryLockLandscape() {
  if (!isTouchDevice || window.innerWidth >= window.innerHeight) return;
  const el = document.documentElement;
  const lock = () => {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  };
  if (el.requestFullscreen) {
    el.requestFullscreen().then(lock).catch(() => {});
  } else {
    lock();
  }
}
document.addEventListener('touchstart', tryLockLandscape, { once: true, passive: true });
window.addEventListener('orientationchange', () => {
  // 游戏进行中转回竖屏时，再次尝试锁回横屏
  setTimeout(() => {
    if (!mapScreenMode && isTouchDevice && window.innerHeight > window.innerWidth && document.fullscreenElement) {
      tryLockLandscape();
    }
  }, 300);
});
mapScreenMode = true;
computeMap(0); // 给 canvas 一个初始地图（隐藏状态下不渲染）
renderPlayerBar();
buildChapterGrid();
// 支持 ?ch=N 直接进入第 N 章
const urlCh = parseInt(new URLSearchParams(location.search).get('ch') || '0', 10);
if (urlCh >= 1 && urlCh <= 10) startChapter(urlCh - 1);
requestAnimationFrame(now => { lastTime = now; requestAnimationFrame(loop); });
</script>
